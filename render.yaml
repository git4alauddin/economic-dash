{
  "previews": { "generation": "off" },
  "services": [
    {
      "type": "web",
      "name": "economic-dash-api",
      "runtime": "python",
      "rootDir": "backend",
      "branch": "main",
      "region": "singapore",
      "plan": "0.5c-512mb",
      "numInstances": 1,
      "autoDeployTrigger": "off",
      "buildCommand": "python -m pip install -r requirements.txt",
      "startCommand": "python -m app.production",
      "healthCheckPath": "/health",
      "disk": { "name": "dashboard-data", "mountPath": "/var/data", "sizeGB": 1 },
      "envVars": [
        { "key": "PYTHON_VERSION", "value": "3.13.7" },
        { "key": "APP_ENV", "value": "production" },
        { "key": "CORS_ALLOWED_ORIGINS", "sync": false },
        { "key": "AUTH_JWT_SIGNING_KEY", "sync": false },
        { "key": "TRUSTED_PROXY_IPS", "value": "[]" },
        { "key": "DATABASE_DIRECTORY", "value": "/var/data/economic-dash" },
        { "key": "COLLECTOR_SCHEDULER_STATE_DIRECTORY", "value": "/var/data/economic-dash" },
        { "key": "COLLECTOR_SCHEDULER_ENABLED", "value": "true" },
        { "key": "AUTH_ACCESS_TOKEN_MINUTES", "value": "15" },
        { "key": "PYTHONUNBUFFERED", "value": "1" }
      ]
    },
    {
      "type": "web",
      "name": "economic-dash-web",
      "runtime": "static",
      "rootDir": "frontend",
      "branch": "main",
      "autoDeployTrigger": "off",
      "buildCommand": "npx --yes npm@11.17.0 ci --include=dev && npx --yes npm@11.17.0 run build:render",
      "staticPublishPath": "dist",
      "envVars": [
        { "key": "NODE_VERSION", "value": "24.19.0" },
        { "key": "SKIP_INSTALL_DEPS", "value": "true" },
        { "key": "VITE_API_BASE_URL", "sync": false }
      ],
      "headers": [
        { "path": "/*", "name": "X-Content-Type-Options", "value": "nosniff" },
        { "path": "/*", "name": "Referrer-Policy", "value": "no-referrer" },
        { "path": "/*", "name": "X-Frame-Options", "value": "DENY" },
        { "path": "/index.html", "name": "Cache-Control", "value": "no-cache" }
      ]
    }
  ]
}
